[package]
name = "macup"
version = "1.0.0"
edition = "2021"
description = "A thin orchestrator for Mac bootstrap and setup"
license = "MIT"
repository = "https://github.com/nhatphat/macup"
readme = "README.md"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }

# Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"

# Parallel execution
rayon = "1.10"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
which = "4.4"
dirs = "4.0"
home = "=0.5.5"
colored = "2.1"
indicatif = "0.17"
regex = "1.10"

# Interactive UI
inquire = "0.7"

# Logging
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3.10"
